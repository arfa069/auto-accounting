name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish internal Release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: internal-termux
    permissions:
      contents: write
    env:
      BKS_BACKEND_URL: ${{ vars.INTERNAL_BACKEND_URL || 'http://192.168.1.13:8080' }}
      BKS_ALLOW_HTTP_LEDGER_SYNC: ${{ vars.INTERNAL_ALLOW_HTTP_LEDGER_SYNC || 'true' }}
      BKS_WECHAT_APP_ID: ${{ vars.BKS_WECHAT_APP_ID }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 36
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version="${tag#v}"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Derived Android versionCode is out of range." >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > apps/android/release.jks
          chmod 600 apps/android/release.jks

      - name: Build release assets
        env:
          BKS_VERSION_NAME: ${{ steps.version.outputs.version }}
          BKS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: >-
          ./gradlew
          :services:backend:distTar
          :apps:android:assembleRelease
          --stacktrace

      - name: Verify and package release assets
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          backend_source="services/backend/build/distributions/bks-backend-${RELEASE_VERSION}.tar.gz"
          apk_source="apps/android/build/outputs/apk/release/android-release.apk"
          backend_asset="bks-backend-${RELEASE_TAG}.tar.gz"
          apk_asset="bks-${RELEASE_TAG}.apk"
          test -f "$backend_source"
          test -f "$apk_source"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          test -x "$aapt_path"
          verification="$("$apksigner_path" verify --verbose "$apk_source")"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$verification"
          grep -Fq "Number of signers: 1" <<< "$verification"
          badging="$("$aapt_path" dump badging "$apk_source" | head -n 1)"
          grep -Fq "versionCode='${RELEASE_VERSION_CODE}'" <<< "$badging"
          grep -Fq "versionName='${RELEASE_VERSION}'" <<< "$badging"

          cp "$backend_source" "release/$backend_asset"
          cp "$apk_source" "release/$apk_asset"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg backendAsset "$backend_asset" \
            --arg androidAsset "$apk_asset" \
            --arg backendUrl "$BKS_BACKEND_URL" \
            --argjson versionCode "$RELEASE_VERSION_CODE" \
            '{
              tag: $tag,
              version: $version,
              versionCode: $versionCode,
              commit: $commit,
              javaMajor: 17,
              backendAsset: $backendAsset,
              androidAsset: $androidAsset,
              backendUrl: $backendUrl,
              internalHttpPrerelease: true
            }' > release/release-manifest.json
          (
            cd release
            sha256sum "$backend_asset" "$apk_asset" release-manifest.json > checksums.sha256
          )

      - name: Publish immutable prerelease
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published and will not be overwritten." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "$RELEASE_TAG 局域网 HTTP 内测" \
              --notes "仅供 192.168.1.0/24 局域网内测；不满足生产 HTTPS 验收。"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease

      - name: Remove signing material
        if: always()
        run: |
          if [[ -f apps/android/release.jks ]]; then
            shred --remove apps/android/release.jks
          fi
          ./gradlew --stop
