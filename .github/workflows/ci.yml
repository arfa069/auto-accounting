name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate Termux scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck deploy/termux/*.sh deploy/termux/services/*/run
          deploy/termux/test-scripts.sh

  backend:
    name: Backend and shared API
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_accounting_ci
          POSTGRES_USER: auto_accounting_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_accounting_ci -d auto_accounting_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTO_ACCOUNTING_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/auto_accounting_ci
      AUTO_ACCOUNTING_POSTGRES_TEST_USER: auto_accounting_ci
      AUTO_ACCOUNTING_POSTGRES_TEST_PASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run backend and shared checks
        run: >-
          ./gradlew
          detekt
          :shared:api:jacocoTestReport
          :services:backend:jacocoTestReport
          --stacktrace

      - name: Upload backend failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            services/backend/build/reports/tests/
            shared/api/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload backend coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-shared-coverage
          path: |
            services/backend/build/reports/jacoco/
            shared/api/build/reports/jacoco/

      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop

  android:
    name: Android
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 36
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Test and build Android
        run: >-
          ./gradlew
          :apps:android:jacocoDebugTestReport
          :apps:android:assembleDebug
          :apps:android:assembleRelease
          --stacktrace

      - name: Upload Android failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: apps/android/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Android coverage and CI APKs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-ci-artifacts
          path: |
            apps/android/build/reports/jacoco/
            apps/android/build/outputs/apk/debug/*.apk
            apps/android/build/outputs/apk/release/*.apk

      - name: Stop Gradle
        if: always()
        run: ./gradlew --stop
