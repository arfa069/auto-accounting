build:
  maxIssues: 200
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 100
  ComplexCondition:
    active: true
    threshold: 4

style:
  active: true
  MaxLineLength:
    active: false
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  UseCheckOrError:
    active: false
  ReturnCount:
    active: true
    max: 8
  LoopWithTooManyJumpStatements:
    active: false
  FunctionOnlyReturningConstant:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
  EmptyFunctionBlock:
    active: false
